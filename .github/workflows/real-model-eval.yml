name: Real-model evaluation

# Runs the scenario suite against a real chat model with tool calling and commits
# the report and per-scenario transcripts to eval/results/. Start it from the
# Actions tab ("Run workflow").
#
# Secrets (Settings → Secrets and variables → Actions):
#   provider "nvidia": NVIDIA_API_KEY        (build.nvidia.com API catalog, OpenAI-compatible)
#   provider "azure":  AZURE_OPENAI_ENDPOINT (https://<resource>.openai.azure.com)
#                      AZURE_OPENAI_API_KEY  (the model input is the deployment name)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider"
        type: choice
        options: [nvidia, azure]
        default: nvidia
      model:
        description: "Chat model with tool calling (NVIDIA model id or Azure deployment name)"
        default: meta/llama-3.3-70b-instruct

permissions:
  contents: write

concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Configure provider
        env:
          PROVIDER: ${{ inputs.provider }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          if [ "$PROVIDER" = nvidia ]; then
            test -n "$NVIDIA_API_KEY" || { echo "::error::secret NVIDIA_API_KEY is not set"; exit 1; }
            BASE=https://integrate.api.nvidia.com/v1; KEY=$NVIDIA_API_KEY
          else
            test -n "$AZURE_OPENAI_API_KEY" || { echo "::error::Azure secrets are not set"; exit 1; }
            BASE="${AZURE_OPENAI_ENDPOINT%/}/openai/v1/"; KEY=$AZURE_OPENAI_API_KEY
          fi
          echo "::add-mask::$KEY"
          { echo "OPENAI_BASE_URL=$BASE"; echo "OPENAI_API_KEY=$KEY"; } >> "$GITHUB_ENV"

      - name: Run scenarios
        env:
          OPENAI_MODEL: ${{ inputs.model }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          SLUG=$(echo "$PROVIDER-$OPENAI_MODEL" | tr '/:.' '---' | tr '[:upper:]' '[:lower:]')
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          incident-agents --backend openai eval --out "eval/results/$SLUG"
          cat "eval/results/$SLUG/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results
          git commit -m "Real-model evaluation: $SLUG" || echo "no changes"
          git push
